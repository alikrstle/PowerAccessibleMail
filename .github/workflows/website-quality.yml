name: Website quality

on:
  push:
    branches: [main]
    paths:
      - website/**
      - .github/workflows/website-quality.yml
  pull_request:
    paths:
      - website/**
      - .github/workflows/website-quality.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run check
